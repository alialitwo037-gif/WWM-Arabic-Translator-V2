name: Check Android Project

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q WWM_Arabic_Translator_V1_4_5x_Audited_GitHubReady.zip -d project

      - name: Show project structure
        run: |
          echo "=== Project files ==="
          find project -maxdepth 8 -type f | sort
