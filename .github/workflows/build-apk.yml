name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Extract Any ZIP File and Fix Structure
      run: |
        for f in *.zip; do
          if [ -f "$f" ]; then
            echo "Extracting $f..."
            unzip -o "$f" -d temp_extract
            
            # إذا كانت الملفات داخل مجلد فرعي داخل الـ ZIP، ينقلها للـ Root مباشرة
            if [ -d temp_extract/app ]; then
              cp -r temp_extract/* .
            else
              cp -r temp_extract/*/* . 2>/dev/null || cp -r temp_extract/* .
            fi
            rm -rf temp_extract
          fi
        done

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
        else
          gradle wrapper
          chmod +x ./gradlew
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
