name: Build WWM Arabic Translator APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.kt'
      - '**.xml'
      - '**.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify repository layout
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root: $PWD"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch/ref: ${GITHUB_REF_NAME:-unknown}"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts

          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/wwm/arabictranslator/MainActivity.kt
          test -f app/src/main/java/com/wwm/arabictranslator/ScreenTranslateService.kt
          test -f app/src/main/java/com/wwm/arabictranslator/WwmAiAssistant.kt
          test -f app/src/main/java/com/wwm/arabictranslator/TranslationMemory.kt
          test -f app/src/main/java/com/wwm/arabictranslator/Glossary.kt
          test -f app/src/main/java/com/wwm/arabictranslator/TranslatorSettings.kt

          test -f app/src/main/res/values/styles.xml
          test -f app/src/main/res/values/strings.xml

          echo "Repository layout verified."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --list_installed | grep -E \
            'platform-tools|platforms;android-35|build-tools;35.0.0' || true

      - name: Validate build configuration
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq \
            'id("com.android.application") version "8.7.3" apply false' \
            build.gradle.kts

          grep -Fq \
            'id("org.jetbrains.kotlin.android") version "2.0.21" apply false' \
            build.gradle.kts

          grep -Fq \
            'compileSdk = 35' \
            app/build.gradle.kts

          grep -Fq \
            'targetSdk = 35' \
            app/build.gradle.kts

          grep -Fq \
            'sourceCompatibility = JavaVersion.VERSION_17' \
            app/build.gradle.kts

          grep -Fq \
            'targetCompatibility = JavaVersion.VERSION_17' \
            app/build.gradle.kts

          grep -Fq \
            'jvmTarget = "17"' \
            app/build.gradle.kts

          grep -Fq \
            'com.google.mlkit:text-recognition:16.0.1' \
            app/build.gradle.kts

          grep -Fq \
            'com.google.mlkit:translate:17.0.3' \
            app/build.gradle.kts

          grep -Fq \
            'setText(prefs.getString("endpoint", "") ?: "")' \
            app/src/main/java/com/wwm/arabictranslator/WwmAiAssistant.kt

          grep -Fq \
            'setText(prefs.getString("api_key", "") ?: "")' \
            app/src/main/java/com/wwm/arabictranslator/WwmAiAssistant.kt

          grep -Fq \
            'import com.google.mlkit.nl.translate.*' \
            app/src/main/java/com/wwm/arabictranslator/ScreenTranslateService.kt

          grep -Fq \
            'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION' \
            app/src/main/AndroidManifest.xml

          grep -Fq \
            'android:foregroundServiceType="mediaProjection"' \
            app/src/main/AndroidManifest.xml

          echo "Build configuration verified."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WWM-Arabic-Translator-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
