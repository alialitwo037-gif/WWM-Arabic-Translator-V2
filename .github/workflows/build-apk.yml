name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Extract Project ZIP if present
      run: |
        if [ -f "WWM_Arabic_Translator_V1_4_FINAL_FIXED_JVM17.zip" ]; then
          echo "Extracting WWM_Arabic_Translator_V1_4_FINAL_FIXED_JVM17.zip..."
          unzip -o WWM_Arabic_Translator_V1_4_FINAL_FIXED_JVM17.zip -d .
        elif [ -f "WWM_Arabic_Translator_V1_4_FINAL_FIXED.zip" ]; then
          echo "Extracting WWM_Arabic_Translator_V1_4_FINAL_FIXED.zip..."
          unzip -o WWM_Arabic_Translator_V1_4_FINAL_FIXED.zip -d .
        fi

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
        else
          gradle wrapper
          chmod +x ./gradlew
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
