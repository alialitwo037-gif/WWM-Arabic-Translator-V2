name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Java and project
        run: |
          echo "=== Java version ==="
          java -version

          echo "=== Project structure ==="
          ls -la
          echo ""
          echo "=== project directory ==="
          ls -la project || true

      - name: Diagnose WwmAiAssistant.kt
        run: |
          FILE="project/app/src/main/java/com/wwm/arabictranslator/WwmAiAssistant.kt"

          echo "=========================================="
          echo " WwmAiAssistant.kt diagnostic"
          echo "=========================================="

          if [ ! -f "$FILE" ]; then
            echo "ERROR: File not found:"
            echo "$FILE"
            echo ""
            echo "Searching for WwmAiAssistant.kt..."
            find . -name "WwmAiAssistant.kt" -type f -print
            exit 1
          fi

          echo "File found:"
          echo "$FILE"
          echo ""

          echo "=== Lines 135-155 ==="
          nl -ba "$FILE" | sed -n '135,155p'

          echo ""
          echo "=== All .text assignments in this file ==="
          grep -nE '\.text[[:space:]]*=' "$FILE" || true

          echo ""
          echo "=== End diagnostic ==="

      - name: Build APK
        run: |
          cd project

          echo "Starting Gradle build..."
          gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WWM-Arabic-Translator-Debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
