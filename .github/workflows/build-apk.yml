name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and diagnose WwmAiAssistant.kt
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Searching for WwmAiAssistant.kt"
          echo "=========================================="

          FILE="$(find . -type f -name 'WwmAiAssistant.kt' -print -quit)"

          if [ -z "$FILE" ]; then
            echo "ERROR: WwmAiAssistant.kt was not found anywhere in the repository."
            echo ""
            echo "Searching for similar Kotlin files:"
            find . -type f \( -name '*.kt' -o -name '*.java' \) | head -100
            exit 1
          fi

          echo "FOUND:"
          echo "$FILE"
          echo ""

          echo "=========================================="
          echo " Lines 135-155"
          echo "=========================================="

          nl -ba "$FILE" | sed -n '135,155p'

          echo ""
          echo "=========================================="
          echo " .text assignments"
          echo "=========================================="

          grep -nE '\.text[[:space:]]*=' "$FILE" || true

          echo ""
          echo "=========================================="
          echo " Diagnostic completed"
          echo "=========================================="

      - name: Show project structure
        shell: bash
        run: |
          echo "=========================================="
          echo " Project structure"
          echo "=========================================="

          find . -maxdepth 3 -type f \
            \( -name 'settings.gradle*' \
            -o -name 'build.gradle*' \
            -o -name 'gradlew' \) \
            -print

      - name: Build APK
        shell: bash
        run: |
          echo "=========================================="
          echo " Starting Gradle build"
          echo "=========================================="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "./project/gradlew" ]; then
            chmod +x ./project/gradlew
            cd project
            ./gradlew assembleDebug --stacktrace
          elif [ -f "./build.gradle.kts" ]; then
            gradle assembleDebug --stacktrace
          elif [ -f "./project/build.gradle.kts" ]; then
            cd project
            gradle assembleDebug --stacktrace
          else
            echo "ERROR: Could not locate Gradle project."
            echo ""
            echo "Gradle files found:"
            find . -type f \
              \( -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \
              -o -name 'build.gradle' \
              -o -name 'build.gradle.kts' \) \
              -print
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WWM-Arabic-Translator-Debug
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
