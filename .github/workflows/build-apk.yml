name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Project ZIP if present
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Preparing Android project"
          echo "=========================================="

          if [ -f "WWM_Arabic_Translator_V1_4_FINAL_FIXED_JVM17.zip" ]; then
            echo "Found: WWM_Arabic_Translator_V1_4_FINAL_FIXED_JVM17.zip"
            unzip -o "WWM_Arabic_Translator_V1_4_FINAL_FIXED_JVM17.zip" -d .
          elif [ -f "WWM_Arabic_Translator_V1_4_FINAL_FIXED.zip" ]; then
            echo "Found: WWM_Arabic_Translator_V1_4_FINAL_FIXED.zip"
            unzip -o "WWM_Arabic_Translator_V1_4_FINAL_FIXED.zip" -d .
          else
            echo "No known project ZIP found."
            echo "Continuing with repository contents..."
          fi

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Locating Gradle Android project"
          echo "=========================================="

          GRADLEW="$(find . -type f -name "gradlew" -print -quit)"

          if [ -n "$GRADLEW" ]; then
            echo "Gradle wrapper found:"
            echo "$GRADLEW"

            PROJECT_DIR="$(dirname "$GRADLEW")"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

            chmod +x "$GRADLEW"
            exit 0
          fi

          SETTINGS="$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)"

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
            echo "Gradle settings found:"
            echo "$SETTINGS"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "ERROR: No Gradle Android project was found."
          echo ""
          echo "Available Gradle files:"
          find . -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \) \
            -print

          exit 1

      - name: Fix WwmAiAssistant Kotlin text assignments
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Checking WwmAiAssistant.kt"
          echo "=========================================="

          FILE="$(find "$PROJECT_DIR" -type f -name "WwmAiAssistant.kt" -print -quit)"

          if [ -z "$FILE" ]; then
            echo "WwmAiAssistant.kt was not found."
            echo "Searching entire repository..."
            FILE="$(find . -type f -name "WwmAiAssistant.kt" -print -quit)"
          fi

          if [ -z "$FILE" ]; then
            echo "ERROR: WwmAiAssistant.kt does not exist."
            echo ""
            echo "Kotlin files found:"
            find "$PROJECT_DIR" -type f -name "*.kt" -print | sort
            exit 1
          fi

          echo "Found:"
          echo "$FILE"
          echo ""

          cp "$FILE" "$FILE.backup"

          python3 - "$FILE" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          original = text

          # Convert simple Android TextView/EditText .text assignments
          # into setText(...) calls.
          #
          # Example:
          #   editText.text = value
          #
          # becomes:
          #   editText.setText(value)
          #
          # This specifically addresses Kotlin's String?/Editable mismatch.

          pattern = re.compile(
              r'(?m)^(\s*)([A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*)\.text\s*=\s*([^\n]+)$'
          )

          def replace(match):
              indent = match.group(1)
              receiver = match.group(2)
              value = match.group(3)

              # Avoid changing an already-correct setText call.
              return f"{indent}{receiver}.setText({value})"

          text = pattern.sub(replace, text)

          if text != original:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
              print("WwmAiAssistant.kt was updated.")
          else:
              print("No direct .text assignment was found.")
          PY

          echo ""
          echo "=========================================="
          echo "Relevant .text assignments after fix"
          echo "=========================================="

          grep -nE '\.text[[:space:]]*=' "$FILE" || true

          echo ""
          echo "=========================================="
          echo "Lines around previous errors"
          echo "=========================================="

          nl -ba "$FILE" | sed -n '135,155p'

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            echo "Using project Gradle wrapper."
          else
            echo "Gradle wrapper not found."
            echo "Generating wrapper..."
            cd "$PROJECT_DIR"
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Starting Gradle build"
          echo "=========================================="

          ./gradlew assembleDebug --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Searching for generated APK"
          echo "=========================================="

          find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
